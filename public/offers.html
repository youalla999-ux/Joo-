<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>العروض والخصومات | Joo Store</title>
  <meta name="description" content="أقوى العروض والخصومات على منتجات Joo Store.">
  <meta name="theme-color" content="#0d6a42">
  
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-offers="1">
  <header id="site-header"></header>

  <main class="wrap">
    <div class="page-hero"><h1>العروض والخصومات</h1><p id="count" class="muted"></p></div>
    <div class="shop-bar">
      <div class="chips" id="chips" aria-label="الأقسام"></div>
      <select class="sort" id="sort" aria-label="الترتيب">
        <option value="new">الأحدث</option><option value="low">الأقل سعرًا</option><option value="high">الأعلى سعرًا</option><option value="rate">الأعلى تقييمًا</option><option value="deals">الأعلى خصمًا</option>
      </select>
    </div>
    <details class="filters" id="filters"><summary>فلترة <em id="fcount" class="hidden"></em></summary>
      <div class="frow">
        <label>السعر من<input type="number" min="0" inputmode="numeric" id="pmin" placeholder="0"></label>
        <label>إلى<input type="number" min="0" inputmode="numeric" id="pmax" placeholder="بدون حد"></label>
        <label class="chk"><input type="checkbox" id="fstock"> متوفر فقط</label>
        <label class="chk"><input type="checkbox" id="foffer"> عروض وخصومات فقط</label>
        <button type="button" class="btn btn-ghost btn-sm" id="freset">مسح الفلاتر</button>
      </div></details>
    <div class="grid" id="grid"></div>
    <div style="text-align:center;padding-bottom:70px"><button class="btn btn-ghost btn-lg hidden" id="more">عرض المزيد</button></div>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="assets/js/shop.js"></script>
</body>
</html>
