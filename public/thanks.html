<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تم استلام طلبك | Joo Store</title>
  <meta name="description" content="تأكيد الطلب.">
  <meta name="theme-color" content="#0d6a42">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="wrap">
    <div class="thanks">
      <div class="okmark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1>تم استلام طلبك</h1>
      <p class="codeline">رقم الطلب <code id="code"></code></p>
      <p class="msg ok" id="payNote" hidden></p>
      <section class="track-card" id="tlCard">
        <h2>حالة طلبك</h2>
        <div id="tl"></div>
        <p class="muted" id="payText">هنراجع طلبك ونأكده، وتقدر تتابع كل خطوة من حسابك.</p>
      </section>
      <div class="thanks-cta"><a id="trackBtn" class="btn btn-primary btn-lg" href="account.html">تابع طلبك</a><a class="btn btn-soft btn-lg" href="shop.html">كمّل تسوق</a></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="assets/js/thanks.js"></script>
</body>
</html>
